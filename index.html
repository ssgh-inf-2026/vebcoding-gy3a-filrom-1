!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulačka známek | Modern</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Přidáme jemný font z Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="bg-white/95 backdrop-blur-sm p-8 rounded-3xl shadow-2xl max-w-md w-full border border-white/20">
        
        <div class="text-center mb-8">
            <div class="inline-block p-3 bg-indigo-100 rounded-2xl mb-4">
                <span class="text-3xl">📊</span>
            </div>
            <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Kalkulačka</h1>
            <p class="text-gray-500 mt-2">Spočítej si svůj studijní průměr</p>
        </div>

        <div class="space-y-6">
            <div>
                <label for="userInput" class="block text-sm font-bold text-gray-700 mb-2 ml-1">Tvoje známky</label>
                <input type="text" id="userInput" placeholder="Např. 1, 2, 1, 3" 
                    class="w-full px-5 py-4 bg-gray-50 border-2 border-gray-100 rounded-2xl focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none transition-all text-lg font-medium">
            </div>

            <button id="testButton" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold py-4 px-6 rounded-2xl transition-all shadow-lg shadow-indigo-200 flex items-center justify-center gap-2">
                <span>Vypočítat výsledek</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" />
                </svg>
            </button>

            <div id="resultContainer" class="hidden transform transition-all duration-500 scale-100">
                <div class="mt-4 p-6 bg-gradient-to-r from-indigo-50 to-blue-50 rounded-2xl border border-indigo-100">
                    <p class="text-center text-indigo-400 text-xs font-black uppercase tracking-widest mb-1">Tvůj průměr je</p>
                    <p id="result" class="text-center text-5xl font-black text-indigo-700">-</p>
                </div>
            </div>
        </div>

        <p class="text-center text-gray-400 text-xs mt-8">Školní projekt &bull; 2026</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
