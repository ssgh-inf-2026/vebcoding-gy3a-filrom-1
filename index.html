<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulačka známek</title>
    <!-- Používáme Tailwind CSS pro moderní a hezký vzhled bez nutnosti psát složité CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    
    <!-- Hlavní kontejner aplikace -->
    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full">
        <h1 class="text-2xl font-bold text-gray-800 mb-2 text-center">🎓 Kalkulačka známek</h1>
        <p class="text-gray-500 text-center mb-6">Aplikace pro studenty, učitele i rodiče.</p>

        <div class="space-y-4">
            <!-- VSTUP (zachováno id="userInput") -->
            <div>
                <label for="userInput" class="block text-sm font-medium text-gray-700 mb-1">Zadej známky (oddělené mezerou nebo čárkou):</label>
                <input type="text" id="userInput" placeholder="Např. 1, 2, 1, 3" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-colors">
            </div>

            <!-- TLAČÍTKO (zachováno id="testButton") -->
            <button id="testButton" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors shadow-md">
                Vypočítat průměr
            </button>

            <!-- VÝSLEDEK (zachováno id="result") -->
            <div class="mt-6 p-4 bg-indigo-50 rounded-lg border border-indigo-100 hidden" id="resultContainer">
                <p class="text-center text-gray-700 text-sm font-semibold uppercase tracking-wide">Výsledný průměr:</p>
                <p id="result" class="text-center text-4xl font-bold text-indigo-600 mt-2">-</p>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIKA -->
    <script>
        // Počkáme, až se načte celá stránka
        document.addEventListener('DOMContentLoaded', () => {
            // Získáme prvky podle ID, která jsi požadoval
            const inputElement = document.getElementById('userInput');
            const buttonElement = document.getElementById('testButton');
            const resultElement = document.getElementById('result');
            const resultContainer = document.getElementById('resultContainer');

            // Přidáme akci, která se stane po kliknutí na tlačítko
            buttonElement.addEventListener('click', () => {
                const inputValue = inputElement.value;

                // Zpracování vstupu: nahradíme čárky mezerami, rozdělíme a odstraníme prázdné mezery
                const gradesArray = inputValue.replace(/,/g, ' ').split(/\s+/).filter(g => g !== '');

                // Kontrola, zda uživatel zadal nějaké známky
                if (gradesArray.length === 0) {
                    resultContainer.classList.remove('hidden');
                    resultElement.className = 'text-center text-xl font-bold text-red-500 mt-2';
                    resultElement.textContent = 'Zadej alespoň jednu známku!';
                    return;
                }

                let sum = 0;
                
                // Projdeme všechny zadané hodnoty
                for (let str of gradesArray) {
                    const grade = parseFloat(str);
                    
                    // Kontrola, zda jsou zadána jen čísla od 1 do 5
                    if (isNaN(grade) || grade < 1 || grade > 5) {
                        resultContainer.classList.remove('hidden');
                        resultElement.className = 'text-center text-xl font-bold text-red-500 mt-2';
                        resultElement.textContent = 'Zadávej pouze známky 1 až 5!';
                        return;
                    }
                    
                    sum += grade;
                }

                // Akce: Výpočet průměru
                const average = sum / gradesArray.length;

                // Výsledek: Zobrazení na obrazovce (zaokrouhleno na 2 desetinná místa)
                resultContainer.classList.remove('hidden');
                resultElement.className = 'text-center text-4xl font-bold text-indigo-600 mt-2';
                resultElement.textContent = average.toFixed(2);
            });
        });
    </script>
</body>
</html>
